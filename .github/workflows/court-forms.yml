name: Court forms check

# Indiana revises its protection order forms from time to time. ReadyFile
# prints answers onto its own copies of the court's PDFs, so a revision must
# be noticed and the copy and its map updated. This checks the court's page
# every week and fails when anything changed; GitHub emails the failure.
on:
  schedule:
    - cron: '17 13 * * 1' # Mondays, 13:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:court-forms
